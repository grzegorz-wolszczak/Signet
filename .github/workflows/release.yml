# Every push to main (a merged pull request) is released:
#   tests -> next version (scripts/release/next-version.sh) -> packages -> GitHub release + tag vX.Y.Z.W.
# The version comes from the last tag and the commit messages of the push: "minor" bumps Y, "patch"/"bugfix" bumps Z,
# anything else bumps W. The tag is made only when every required package was built, so a failed run uses up no
# version. Runs one at a time, in push order.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The messages of all commits of the push (one squash commit for a merged pull request); the head commit
          # alone when the previous head is unknown.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git log --format=%B "$BEFORE..$GITHUB_SHA" > "$RUNNER_TEMP/messages.txt"
          else
            git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/messages.txt"
          fi
          version="$(scripts/release/next-version.sh "$RUNNER_TEMP/messages.txt")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-24.04
    # The oldest supported base: the AppImage bundles this system's WebKitGTK and GTK (glibc 2.35 and newer).
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl ca-certificates git file desktop-file-utils dpkg-dev rpm zip libicu70 \
            libwebkit2gtk-4.1-0 libgtk-3-dev librsvg2-common

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Package the application
        run: scripts/release/package-linux.sh "${{ needs.version.outputs.version }}" artifacts/release

      - name: Package the command-line tools
        run: scripts/release/package-tools.sh "${{ needs.version.outputs.version }}" artifacts/release

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: artifacts/release/*
          retention-days: 7

  windows:
    name: Windows package
    needs: version
    runs-on: windows-2022
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Package (single file)
        shell: pwsh
        run: scripts/release/package-windows.ps1 -Version "${{ needs.version.outputs.version }}" -Variant SingleFile -Output artifacts/release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: artifacts/release/*
          retention-days: 7

  windows-aot:
    name: Windows package (NativeAOT, experimental)
    needs: version
    runs-on: windows-2022
    # Experimental: a failure leaves this package out of the release instead of stopping it.
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Package (NativeAOT)
        shell: pwsh
        run: scripts/release/package-windows.ps1 -Version "${{ needs.version.outputs.version }}" -Variant Aot -Output artifacts/release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-aot
          path: artifacts/release/*
          retention-days: 7

  release:
    name: GitHub release
    needs: [test, version, linux, windows, windows-aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la packages
          gh release create "v$VERSION" packages/* --target "$GITHUB_SHA" --title "Signet $VERSION" --generate-notes
