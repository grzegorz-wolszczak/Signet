# Tests of every pull request into main. The job "Linux tests" is the status check the main ruleset requires
# (.github/rulesets/main.json). The release workflow calls this workflow again after the merge.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # WebKitGTK for the tests of the Linux Preview backend; Xvfb gives them (and GTK) a display.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth

      - name: Test
        # Every test project of the solution. Benchmarks and the Java differential tests skip themselves (they need
        # SIGNET_BENCHMARKS / SIGNET_JAVA_EPUBCHECK).
        run: xvfb-run -a dotnet test Signet.slnx --logger "trx" --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14
